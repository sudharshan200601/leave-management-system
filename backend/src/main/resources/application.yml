spring:
  application:
    name: leave-management
  datasource:
    url: jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

leave:
  escalation:
    manager-timeout-hours: 24
    hr-timeout-hours: 72
    check-interval-minutes: 15
  conflict:
    max-team-absence-percent: 40
  annual-quota-days: 24
  proration:
    method: MONTHLY

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

server:
  port: 8080
